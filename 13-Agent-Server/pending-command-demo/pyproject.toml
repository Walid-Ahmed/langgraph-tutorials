[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pending-command-demo"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "langgraph==1.2.16",
  "langgraph-sdk==0.4.8",
  "langgraph-cli[inmem]==0.4.37",
]

[tool.setuptools.packages.find]
include = ["server*"]
